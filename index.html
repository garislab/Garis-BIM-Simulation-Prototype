<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foodhub Building Simulator</title>
<meta name="description" content="Evaluate the ARS Bldg Foodhub BIM model for energy, heat, daylight, airflow, and noise, then test design solutions and see the results change instantly.">
<meta name="theme-color" content="#0f7d6b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f7d6b%22/%3E%3Ccircle cx=%2222%22 cy=%2210%22 r=%224%22 fill=%22%23ffd36b%22/%3E%3Cpath d=%22M6 26V14l8-4v16zM14 26V12h10v14z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hud">
      <div class="brand">ARS Bldg Foodhub<small data-i18n="brand.sub">Building simulator · IFC2X3</small></div>
      <div class="clock"><b id="clk">12:00</b><span id="sunInfo"></span></div>
    </div>
    <div class="topr">
      <nav class="tabs" role="group" id="tabs" data-i18n-aria="aria.tabs">
        <button data-a="model" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11zM9 20v-6h6v6"/></svg><span>Overview</span></button>
        <button data-a="energi" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg><span>Energy</span></button>
        <button data-a="suhu" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14V5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0z"/></svg><span>Heat</span></button>
        <button data-a="cahaya" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg><span>Daylight</span></button>
        <button data-a="udara" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg><span>Airflow</span></button>
        <button data-a="suara" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span>Noise</span></button>
      </nav>
      <div class="pill sm" role="group" id="subs" data-i18n-aria="aria.view"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="audiodock" id="audioDock" hidden>
      <button class="abtn" id="audioBtn" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v6H5a1 1 0 0 1-1-1zM20 14h-3v6h2a1 1 0 0 0 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Play 3D sound</span></button>
      <button class="abtn ghost" id="trainBtn">Bring a train now</button>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="tl">
      <button id="play" aria-label="Play or pause"><svg width="14" height="14" viewBox="0 0 14 14" id="playIco"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <div class="trk">
        <input type="range" id="hour" min="0" max="24" step="0.01" value="6" data-i18n-aria="aria.hour">
        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>
      <select class="tsel" id="month" data-i18n-aria="aria.month"></select>
      <select class="tsel" id="spd" data-i18n-aria="aria.speed"><option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option><option value="4">4</option></select>
    </div>
  </main>

  <aside id="panel">
    <div class="ptop">
      <div class="seg lang" id="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">EN</button><button data-l="id" aria-pressed="false">ID</button></div>
      <button class="help" id="helpBtn"><span aria-hidden="true">?</span><span data-i18n="help">How it works</span></button>
    </div>
    <header class="ahead">
      <div class="astep" id="aStep"></div>
      <h1 id="aTitle"></h1>
      <p id="aSub"></p>
    </header>

    <section class="card" id="secVerdict">
      <div class="sh"><span class="num">1</span><span data-i18n="sec.eval">Evaluate</span></div>
      <div id="verdict"></div>
    </section>

    <section class="card" id="secSol">
      <div class="sh"><span class="num">2</span><span data-i18n="sec.act">Act: design solutions</span><span class="cnt" id="solCount"></span></div>
      <p class="hint" id="solHint"></p>
      <div class="sols" id="sols"></div>
      <div class="sbtns"><button class="abtn" id="solApply"></button><button class="abtn ghost" id="solReset" data-i18n="sol.reset">Reset</button></div>
    </section>

    <details class="card cond" id="secCtrl">
      <summary><span class="sh"><span class="num">⚙</span><span data-i18n="sec.cond">Test conditions</span></span><span class="csum" id="condSum"></span></summary>
      <div class="ctrls" id="ctrls"></div>
    </details>

    <section class="card" id="secKpi">
      <div class="sh"><span class="num">3</span><span data-i18n="sec.diag">Diagnose: where and when</span></div>
      <div class="lbl" id="kpiLbl"></div>
      <div class="kpis" id="kpis"></div>
      <div id="secChart">
        <h2 id="chTitle"></h2>
        <canvas class="chart" id="ch1" role="img" data-i18n-aria="aria.chart"></canvas>
        <div class="chleg" id="chLeg"></div>
        <div class="now" id="nowLine"></div>
      </div>
      <div id="secStack">
        <h2 id="stTitle"></h2>
        <div class="stack" id="stack"></div>
        <div class="keys" id="keys"></div>
      </div>
    </section>

    <details class="card" id="secZones">
      <summary><span class="sh"><span class="num">≡</span><span id="zlTitle"></span></span></summary>
      <div class="zl" id="zl"></div>
      <div class="detail" id="detail" hidden></div>
    </details>

    <details class="card note" id="secNotes">
      <summary><span class="sh"><span class="num">i</span><span data-i18n="sec.notes">Model assumptions</span></span></summary>
      <div id="notes"></div>
    </details>
    <p class="foot" data-i18n="foot">Concept-stage estimates for comparing design options.</p>
  </aside>
</div>

<div class="intro" id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="ibox">
    <div class="seg lang" id="introLang" role="group" aria-label="Language"></div>
    <div id="introBody"></div>
    <button class="abtn" id="introGo">Start</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
